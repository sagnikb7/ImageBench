name: Bug report
description: Report a reproducible ImageBench problem without sharing private photos or metadata.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve ImageBench. Please redact personal paths, EXIF values, and location data.
  - type: input
    id: version
    attributes:
      label: ImageBench version or commit
      placeholder: 0.2.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: architecture
    attributes:
      label: Mac architecture
      options:
        - Apple Silicon
        - Intel
        - Unknown
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.4
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Affected tool
      options:
        - Bulk Photo Compressor
        - Image Splitter
        - Watermark Studio
        - Aspect Ratio Filler
        - EXIF Viewer
        - Dependency setup or packaging
        - App shell or navigation
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Include selected options and input format, but do not attach a private source image.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and redacted console output
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private image content, personal paths, location data, and sensitive metadata.
          required: true
